<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>లాగిన్ · ఓటరు శోధన</title>
<style>
@font-face{font-family:'Noto Sans Telugu';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/noto-sans-telugu-telugu-400-normal.woff2) format('woff2');unicode-range:U+0C00-0C7F,U+200C-200D,U+25CC;}
@font-face{font-family:'Noto Sans Telugu';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/noto-sans-telugu-telugu-600-normal.woff2) format('woff2');unicode-range:U+0C00-0C7F,U+200C-200D,U+25CC;}
@font-face{font-family:'Noto Sans Telugu';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/noto-sans-telugu-telugu-700-normal.woff2) format('woff2');unicode-range:U+0C00-0C7F,U+200C-200D,U+25CC;}

  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1ea;font-family:'Noto Sans Telugu',system-ui,sans-serif;color:#1f2a30}
  form{background:#fff;padding:32px 28px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);width:min(340px,88vw)}
  h1{font-size:20px;margin:0 0 4px}
  p{margin:0 0 20px;color:#6b7378;font-size:14px}
  input{width:100%;box-sizing:border-box;padding:12px 14px;font-size:16px;border:1.5px solid #d6d2c8;border-radius:10px}
  input:focus{outline:none;border-color:#0f6b5c}
  button{margin-top:14px;width:100%;padding:12px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:#0f6b5c;color:#fff;cursor:pointer}
  .err{color:#b3261e;font-size:14px;margin-top:10px;display:none}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>ఓటరు శోధన · Voter Search</h1>
  <p>గణపవరం గ్రామ పంచాయతీ – 2026</p>
  <input type="password" name="password" placeholder="పాస్‌వర్డ్ / Password" autofocus required>
  <button type="submit">లాగిన్ · Login</button>
  <div class="err" id="e">తప్పు పాస్‌వర్డ్ · Wrong password</div>
</form>
<script>
  const e = new URLSearchParams(location.search).get('e'), box = document.getElementById('e');
  if (e === '1') box.style.display = 'block';
  if (e === 'idle') {
    box.textContent = 'పని లేకపోవడంతో లాగ్ అవుట్ అయ్యారు. మళ్ళీ లాగిన్ అవ్వండి · Logged out after 5 minutes of no activity.';
    box.style.color = '#0f6b5c'; box.style.display = 'block';
  }
</script>
</body>
</html>
