<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>లాగిన్ · ఓటరు శోధన</title>
<style>
@font-face{font-family:'Noto Sans Telugu';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/noto-sans-telugu-telugu-400-normal.woff2) format('woff2');unicode-range:U+0C00-0C7F,U+200C-200D,U+25CC;}
@font-face{font-family:'Noto Sans Telugu';font-style:normal;font-weight:600;font-display:swap;src:url(/fonts/noto-sans-telugu-telugu-600-normal.woff2) format('woff2');unicode-range:U+0C00-0C7F,U+200C-200D,U+25CC;}
@font-face{font-family:'Noto Sans Telugu';font-style:normal;font-weight:700;font-display:swap;src:url(/fonts/noto-sans-telugu-telugu-700-normal.woff2) format('woff2');unicode-range:U+0C00-0C7F,U+200C-200D,U+25CC;}

  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1ea;font-family:'Noto Sans Telugu',system-ui,sans-serif;color:#1f2a30}
  form{background:#fff;padding:32px 28px;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.08);width:min(340px,88vw)}
  h1{font-size:20px;margin:0 0 4px}
  p{margin:0 0 20px;color:#6b7378;font-size:14px}
  input{width:100%;box-sizing:border-box;padding:12px 14px;font-size:16px;border:1.5px solid #d6d2c8;border-radius:10px}
  input:focus{outline:none;border-color:#0f6b5c}
  button{margin-top:14px;width:100%;padding:12px;font-size:16px;font-weight:600;border:0;border-radius:10px;background:#0f6b5c;color:#fff;cursor:pointer}
  .err{color:#b3261e;font-size:14px;margin-top:12px;display:none;line-height:1.6;background:#fdecea;border-radius:8px;padding:8px 10px}
  .err.info{color:#0f6b5c;background:#e7f2ef}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>ఓటరు శోధన · Voter Search</h1>
  <p>గణపవరం గ్రామ పంచాయతీ – 2026</p>
  <input type="text" name="username" placeholder="యూజర్ పేరు / Username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus required>
  <input type="password" name="password" placeholder="పాస్‌వర్డ్ / Password" autocomplete="current-password" required style="margin-top:10px">
  <input type="hidden" name="next" id="next">
  <button type="submit">లాగిన్ · Login</button>
  <div class="err" id="e"></div>
</form>
<script>
  const p = new URLSearchParams(location.search), e = p.get('e'), box = document.getElementById('e');
  const M = {
    bad: 'యూజర్ పేరు లేదా పాస్‌వర్డ్ తప్పు · Wrong username or password',
    inactive: 'మీ ఖాతా నిలిపివేయబడింది. అడ్మిన్‌ను సంప్రదించండి · Your account is disabled. Contact admin.',
    limit: `పరికరాల పరిమితి (${p.get('n') || ''}) పూర్తయింది. కొత్త పరికరం కోసం అడ్మిన్‌ను సంప్రదించండి · Device limit reached. Ask admin to remove an old device.`,
    blocked: 'ఈ పరికరం బ్లాక్ చేయబడింది · This device is blocked by admin.',
    rate: 'చాలా ప్రయత్నాలు. 15 నిమిషాల తర్వాత ప్రయత్నించండి · Too many attempts. Try after 15 minutes.',
    idle: 'పని లేకపోవడంతో లాగ్ అవుట్ అయ్యారు. మళ్ళీ లాగిన్ అవ్వండి · Logged out after inactivity. Please log in again.',
    removed: 'మీ సెషన్ ముగిసింది. మళ్ళీ లాగిన్ అవ్వండి · Session ended. Please log in again.'
  };
  if (M[e]) { box.textContent = M[e]; box.style.display = 'block'; if (e === 'idle' || e === 'removed') box.classList.add('info'); }
  if (p.get('next') === 'admin') document.getElementById('next').value = 'admin';
</script>
</body>
</html>
